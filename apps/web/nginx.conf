# Mirrors what the Vite dev proxy does: serve the SPA, and forward /api and
# /ws to the API by its compose service name. Resolved at container start
# (not at nginx config-parse time), so the api container can come up after
# this one without nginx refusing to start.
resolver 127.0.0.11 valid=10s;

server {
  listen 80;
  server_name _;

  # Vite's build output; client-side routing falls through to index.html.
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Static assets: Vite fingerprints filenames, so a long cache is safe.
  location ~* \.(js|css|svg|woff2?|ttf|png|jpg|jpeg|webp)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
