services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: workos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workos
      POSTGRES_PASSWORD: workos
      POSTGRES_DB: workos
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workos -d workos"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: workos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible storage for local dev, for file attachment uploads.
  #
  # This used to be MinIO, but MinIO's official image is no longer pullable
  # from Docker Hub for anonymous/unauthenticated users (a licensing change,
  # not anything this project did) — `minio/minio` and its usual mirrors
  # (quay.io, Bitnami) all now return 401/403 on a plain `docker pull`. S3Mock
  # is a real, actively maintained, freely-distributed alternative built for
  # exactly this job: a local S3-compatible server with no credential setup.
  # It does not enforce request signatures, so the app's real AWS SDK
  # S3 client code runs unmodified against it.
  storage:
    image: adobe/s3mock:3.11.0
    container_name: workos-storage
    restart: unless-stopped
    environment:
      initialBuckets: workos-uploads
    ports:
      - "59000:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Full self-hosted stack ────────────────────────────────────────────────
  # Everything below needs only Docker — no local Node install, no `npm
  # install` on the host. Behind the "app" profile so plain `docker compose
  # up` (what `npm run infra:up` runs) is unaffected: these three only start
  # with `docker compose --profile app up -d` (`npm run docker:up`).
  #
  # Reads the same root `.env` as local dev for anything that isn't specific
  # to the compose network (API keys, SESSION_SECRET, feature flags) — copy
  # `.env.example` to `.env` first if you want those honoured; it works with
  # none of that too, AI features will just report themselves unconfigured.
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: workos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Compose-network addresses — intentionally not overridable from a
      # plain-localhost .env meant for running the app outside Docker.
      DATABASE_URL: postgres://workos:workos@postgres:5432/workos
      REDIS_URL: redis://redis:6379
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://storage:9090
      S3_PUBLIC_URL: http://localhost:59000
      S3_REGION: us-east-1
      S3_BUCKET: workos-uploads
      S3_ACCESS_KEY_ID: workos
      S3_SECRET_ACCESS_KEY: workos
      S3_FORCE_PATH_STYLE: "true"
      # nginx fronts both the web app and the API under one origin.
      WEB_ORIGIN: http://localhost:8090
      API_BASE_URL: http://localhost:8090
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-0123456789abcdef}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RUN_WORKERS_INLINE: "false"
      # Passed through from .env if present; the app reports itself
      # unconfigured and keeps working without any of these.
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-disabled}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      # Exposed mainly so `npm run migrate`/`seed` can also be run from the
      # host against this same container's API if you ever want to; the web
      # container reaches it internally and doesn't need this.
      - "4000:4000"

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: workos-worker
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
      # The worker checks for pending migrations at boot and refuses to start
      # if there are any — give the API a head start to apply them.
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://workos:workos@postgres:5432/workos
      REDIS_URL: redis://redis:6379
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://storage:9090
      S3_PUBLIC_URL: http://localhost:59000
      S3_REGION: us-east-1
      S3_BUCKET: workos-uploads
      S3_ACCESS_KEY_ID: workos
      S3_SECRET_ACCESS_KEY: workos
      S3_FORCE_PATH_STYLE: "true"
      WEB_ORIGIN: http://localhost:8090
      API_BASE_URL: http://localhost:8090
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-0123456789abcdef}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-disabled}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: workos-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8090:80"

volumes:
  pgdata:
  redisdata:
